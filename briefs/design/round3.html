<!doctype html>
<html><head><meta charset="utf-8"><title>Coach round 3</title>
<style>
:root{--bg:#FAF9F7;--band:#F0EFEC;--text:#1F1E1D;--muted:#8A8782;--faint:#D6D4D0;--line:#E3E1DD;
--plan:#6E5FC4;--planbar:#8B7FD6;--brief:#1F8577;--briefbar:#2A9D8F;--review:#B06A12;--reviewbar:#D08A1E;--own:#B83C6A;--ownbar:#D45A85}
*{box-sizing:border-box}body{margin:0;background:#E7E5E1;font:16px/1.55 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:19px;margin:8px 0 2px}.lead{color:#5E5B57;font-size:14px;margin:0 0 6px}
h2{font-size:12px;color:var(--muted);font-weight:600;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.07em}
.why{font-size:13px;color:#6A6763;margin:-2px 0 8px}
.frame{background:var(--bg);border-radius:12px;padding:22px 26px}
.bubble{margin-left:auto;width:max-content;max-width:80%;background:var(--band);border-radius:16px;padding:10px 18px}
.meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:7px 2px 18px}
.meta.r{justify-content:flex-end}.reply{margin:4px 0 6px}
.tool{font:14px ui-monospace,Menlo,monospace;color:#55534F}
.log{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14.5px;margin:16px 0}.log code{font:12.5px ui-monospace,Menlo,monospace;color:#9A978F}
.git{background:var(--band);border-radius:14px;padding:11px 20px;font:15px ui-monospace,Menlo,monospace;color:#55534F;margin-top:16px;display:flex;justify-content:space-between}
.band{background:var(--band);border-radius:14px;padding:12px 20px;margin-top:10px}
.prompt{background:#fff;border:1px solid #E0DED9;border-radius:16px;padding:13px 18px;color:#A3A09B;margin-top:10px}
.rail{display:flex;align-items:center;gap:14px;min-height:26px}
.cap{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.coach{color:#3D3B38;margin-left:auto}
.g{display:inline-flex;align-items:center}.g i{display:block;height:3px;border-radius:2px;background:var(--faint)}
.hair{height:1px;background:var(--line);margin:12px 0}
.ttl{display:flex;align-items:flex-start;gap:12px}.ttl .t{flex:1}.x{color:#9A978F;font-size:15px}
.q{color:var(--muted);font-style:italic;font-size:14.5px;margin-top:1px}.q b{font-style:normal;font-weight:400;margin-right:6px;color:#B5B2AC}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{background:#FBFAF8;border:1px solid #DCD9D4;border-radius:9px;padding:4px 12px;font-size:15px;white-space:nowrap}
.plain{color:var(--muted);padding:4px 4px}.dim{color:var(--muted)}
.hdr{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:3px}
.pane{background:#fff;border:1px solid #E3E1DD;border-radius:14px;width:330px;padding:14px 18px;font-size:15px}
.pane .ph{display:flex;justify-content:space-between;color:#55534F;margin-bottom:12px}
.st{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;align-items:center;margin:4px 0 14px}
.st .n{white-space:nowrap}.st .d{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.set{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:14.5px}
.sel{border:1px solid #DCD9D4;border-radius:8px;padding:1px 8px;font-size:14px;color:#3D3B38}
.foot{color:var(--muted);font-size:13px;margin-top:16px;line-height:1.45}
.input{border:1px solid #DCD9D4;border-radius:9px;padding:5px 10px;color:#A3A09B;flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bad{outline:2px dashed #d9534f55;outline-offset:4px}
</style></head><body><div class="wrap" id="root"></div>
<script>
const C={plan:['--planbar','--plan','Plan','deciding what Claude should do','Decide what Claude should do'],brief:['--briefbar','--brief','Brief','your next prompt','Say what you need'],review:['--reviewbar','--review','Review','checking what Claude gave you','Check what came back'],own:['--ownbar','--own','Own','standing behind what you ship','Stand behind what ships']};
const K=['plan','brief','review','own'],W=[10,15,15,10],G=[0,4,2,4];
const g=(st,s=1)=>`<span class="g">${K.map((k,i)=>`<i style="margin-left:${G[i]*s}px;width:${W[i]*s}px;${k===st?`background:var(${C[k][0]})`:''}"></i>`).join('')}</span>`;
const word=(st,f)=>`<span style="color:var(${C[st][1]});white-space:nowrap">${f?'Focus · ':''}${C[st][2]}</span>`;
const rail=(st,o={})=>`<div class="rail">${g(st)}${word(st,o.focus)}<span class="cap">${o.cap||C[st][3]}</span><span class="coach">Coach</span></div>`;
const git=`<div class="git"><span>ai-coach&nbsp;&nbsp;main</span><span style="color:#3E8E3E">+4,521 <span style="color:#C0392B">-0</span></span></div>`;
const prompt=t=>`<div class="prompt">${t||'Type / for commands'}</div>`;
const btns=a=>a.map(t=>`<span class="btn">${t}</span>`).join('');
const S=[];const add=(h,why,body)=>S.push(`<h2>${h}</h2><div class="why">${why}</div><div class="frame">${body}</div>`);

add('1 · In the chat','Your prompt now carries its label (it was missing). Labels are an Svg image on desktop: pixel-exact bars, one tone of grey. The step change is a quiet engine line.',
`<div class="bubble">Use contract end instead. Go.</div>
<div class="meta r">${g('brief',.75)}<span>Brief</span><span>✓ Corrected Claude's definition</span></div>
<div class="meta" style="margin-bottom:4px">${g('review',.75)}<span>Review</span></div>
<p class="reply">Done. Churn is 18.4% for Q3, driven mainly by the SMB tier. I excluded 312 trial accounts from the base.</p><div class="tool">Write churn.py +142</div>
<div class="log"><code>coach</code><span>Own · push paused</span></div>`);

add('2 · At rest','One row. Nothing else until there is something worth saying.',git+`<div class="band">${rail('review')}</div>`+prompt());

add('3 · Coach pressed: one row, not three','Steps on the left as the way to focus; cost and the off switch on the right. Settings live in the pane. The current step is the one already named in the line below, so no glyph is repeated.',
git+`<div class="band"><div class="row" style="margin-top:0;justify-content:space-between"><span class="row" style="margin:0"><span class="dim" style="margin-right:2px">Focus on</span>${btns(['Plan','Brief','Review','Own'])}</span><span class="row" style="margin:0"><span class="dim">≈$0.02 this session</span><span class="btn">Turn off</span></span></div><div class="hair"></div>${rail('review')}</div>`+prompt());

add('4 · A finding','Claim first, its source right under it, then two ways to act. No header: the step line already says where you are.',
git+`<div class="band"><div class="ttl"><span class="t">Claude excluded 312 trial accounts on its own. Was that your call?</span><span class="x">✕</span></div><div class="q"><b>“</b>excluded 312 trial accounts</div><div class="row">${btns(['Show with and without trials','What else did you assume?'])}</div><div class="hair"></div>${rail('review')}</div>`+prompt());

add('5 · Focus · Brief','Shows at once after a step is picked (a static version first; the specific one replaces it when ready). The prompt box gets a template.',
git+`<div class="band"><div class="ttl"><span class="t">Your next prompt could say what Mette needs to decide.</span><span class="x">✕</span></div><div class="q"><b>“</b>Mette's steering group</div><div class="row">${btns(['What Mette decides','What done looks like'])}</div><div class="hair"></div>${rail('brief',{focus:1})}</div>`+prompt('<span style="color:#1F1E1D">Mette needs to decide ___ on Thursday, so focus on ___.</span>'));

add('6 · Own, before a push','Three checks on one row; ticking all three lets the push run.',
git+`<div class="band"><div class="ttl"><span class="t">This reaches Mette before Thursday. Three quick checks.</span><span class="x">✕</span></div><div class="q"><b>“</b>git push · email to Mette</div><div class="row">${btns(['☐ Tested myself','☐ No client data','☐ Trial exclusion explained'])}<span class="plain">Continue anyway</span></div><div class="hair"></div>${rail('own')}</div>`+prompt());

add('7 · The pane','Same marks as the chat: mini bars instead of coloured dots, plain meanings instead of framework names, real controls for settings.',
`<div class="pane"><div class="ph"><span>Coach</span><span class="dim">⤢ ✕</span></div>
${rail('plan').replace('<span class="coach">Coach</span>','')}
<div class="st" style="margin-top:12px">${K.map(k=>`${g(k,.7)}<span class="n">${C[k][2]}</span><span class="d">${C[k][4]}</span>`).join('')}</div>
<div class="sec">This conversation</div><div>Testing the coach across chats and its setup</div>
<div class="sec">Stuck?</div><div class="row" style="margin-top:2px">${btns(['My result isn’t what I wanted','How do I check this?','Should Claude do this at all?','What do I tell the client?'])}</div>
<div class="row"><span class="input">Ask about this work</span><span class="btn">Ask</span></div>
<div class="sec">Settings</div>
<div class="set"><span>Coach checks</span><span class="sel">Every turn ▾</span></div>
<div class="set"><span>Pause pushes for a check</span><span class="sel">Off ▾</span></div>
<div class="set"><span>Labels in the chat</span><span class="sel">On ▾</span></div>
<div class="foot">Coach ≈$0.02 of $13.97 this session<br>Based on the AI Fluency Framework by Dakan, Feller and Anthropic, CC BY-NC-SA 4.0.</div></div>`);

document.getElementById('root').innerHTML=`<h1>Coach, round 3: the art style</h1><p class="lead">Quiet marks: one colour per step, used only on a 3px bar and the step word. Everything else is the chat's own grey type and native buttons. One line at rest; one more row only when the coach has something or you ask.</p>`+S.join('');
</script></body></html>
